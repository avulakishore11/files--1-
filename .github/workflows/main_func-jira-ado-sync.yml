name: Build and deploy Python project to Azure Function App - func-jira-ado-sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Zip source for deployment
        run: |
          zip release.zip \
            function_app.py \
            host.json \
            requirements.txt

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EB572A570386438CB8F30CB2C438D6C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC9834292E1E49028E4A8D597C850EF8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C80484E501484E0EBD0E587FC519A65E }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'func-jira-ado-sync'
          slot-name: 'Production'
          package: release.zip
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          

# Azure DevOps CI/CD Pipeline
# Project      : Jira → Azure Boards Sync
# Function App : func-jira-ado-sync (Linux Consumption)
# Runtime      : Python 3.11

trigger:
  branches:
    include:
      - main

variables:
  - group: group   # ADO Library variable group (contains ADO_PAT, JIRA_WEBHOOK_SECRET)
  - name: azureServiceConnection
    value: 'ado-2-azure'
  - name: functionAppName
    value: 'func-jira-ado-sync'
  - name: resourceGroup
    value: 'kaseya-rg'
  - name: pythonVersion
    value: '3.11'

# ─────────────────────────────────────────────────────────────
# STAGE 1 — BUILD
# ─────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildJob
        displayName: 'Package function app'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'

          - bash: |
              pip install \
                --target="$(System.DefaultWorkingDirectory)/.python_packages/lib/site-packages" \
                -r requirements.txt
            displayName: 'Install dependencies into .python_packages'

          - bash: |
              zip -r $(Build.ArtifactStagingDirectory)/release.zip . \
                --exclude=".git/*" \
                --exclude=".github/*" \
                --exclude="local.settings.json" \
                --exclude="__pycache__/*" \
                --exclude=".venv/*" \
                --exclude="venv/*" \
                --exclude="*.pyc" \
                --exclude="azure-pipelines.yml" \
                --exclude="main.yml"
            displayName: 'Zip source + packages'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/release.zip'
              ArtifactName: 'drop'
              publishLocation: 'Container'

# ─────────────────────────────────────────────────────────────
# STAGE 2 — DEPLOY
# ─────────────────────────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to func-jira-ado-sync'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'

        strategy:
          runOnce:
            deploy:
              steps:
                # Artifacts are auto-downloaded to $(Pipeline.Workspace)/<ArtifactName>/
                - task: AzureFunctionApp@2
                  displayName: 'Deploy to Azure Functions'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'functionAppLinux'
                    appName: '$(functionAppName)'
                    package: '$(Pipeline.Workspace)/drop/release.zip'
                    deploymentMethod: 'zipDeploy'

                - task: AzureAppServiceSettings@1
                  displayName: 'Apply app settings'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appName: '$(functionAppName)'
                    resourceGroupName: '$(resourceGroup)'
                    appSettings: |
                      [
                        {
                          "name": "FUNCTIONS_WORKER_RUNTIME",
                          "value": "python",
                          "slotSetting": false
                        },
                        {
                          "name": "ADO_ORG",
                          "value": "kavula",
                          "slotSetting": false
                        },
                        {
                          "name": "ADO_PROJECT",
                          "value": "Kaseya_infra",
                          "slotSetting": false
                        },
                        {
                          "name": "ADO_PAT",
                          "value": "$(ADO_PAT)",
                          "slotSetting": false
                        },
                        {
                          "name": "JIRA_WEBHOOK_SECRET",
                          "value": "$(JIRA_WEBHOOK_SECRET)",
                          "slotSetting": false
                        },
                        {
                          "name": "JIRA_BASE_URL",
                          "value": "https://kishore32780.atlassian.net",
                          "slotSetting": false
                        }
                      ]
